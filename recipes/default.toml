# Receitas da comunidade: o que o numapilot sabe sobre cada placa e GPU.
# Atualizável sem recompilar: `numapilot recipes update` grava uma cópia nova em
# /var/lib/numapilot/recipes.toml, que tem prioridade sobre esta.
version = 1

[[board]]
id = "bc250"
name = "AMD BC-250 (Cyan Skillfish)"
gpu_ids = ["1002:13fe"]
gfx = ["gfx1013"]
name_contains = ["cyan skillfish"]
# Kernels que quebram o driver da GPU da BC-250 (intervalos fechados).
bad_kernels = [["6.15.0", "6.15.6"], ["6.17.8", "6.17.10"]]
min_mesa = "25.1"
governor_services = ["cyan-skillfish-governor-smu", "cyan-skillfish-governor-tt", "cyan-skillfish-governor", "oberon-governor"]
governor_configs = [
    "/etc/cyan-skillfish-governor-smu/config.toml",
    "/etc/cyan-skillfish-governor-tt/config.toml",
    "/etc/cyan-skillfish-governor/config.toml",
]
governor_aur = ["cyan-skillfish-governor-smu", "cyan-skillfish-governor"]
kernel_params = ["amd_iommu=off"]
cpu_oc_tools = ["bc250-detect", "bc250-apply"]
cpu_oc_url = "https://github.com/bc250-collective/bc250_smu_oc"
docs = "https://elektricm.github.io/amd-bc250-docs/"
no_video_encoder = true
cores = [6, 8]
cus = [24, 40]
apps = [
    { name = "BC250 Control Center", recommended = true, bins = ["bc250-control-center"], aur = "bc250-control-center-git", url = "https://github.com/movacx/bc250-control-center", about = "faz tudo da BC-250: governor e laboratório de voltagem da GPU, overclock da CPU, ventoinha, 40 CUs ao vivo, 8 núcleos, memória da GPU (TTM), telemetria. Pacote -git do próprio autor: atualizar recompila do código mais novo" },
    { name = "umr", bins = ["umr"], aur = "umr-git", url = "https://gitlab.freedesktop.org/tomstdenis/umr", about = "acesso aos registradores da GPU, usado para ligar os 40 CUs sem kernel com patch" },
    { name = "bc250-cu-live-manager", bins = ["bc250-cu-live-manager.sh"], git = "https://github.com/WinnieLV/bc250-cu-live-manager", scripts = ["bc250-cu-live-manager.sh"], aur_deps = ["umr-git"], url = "https://github.com/WinnieLV/bc250-cu-live-manager", about = "liga e desliga CUs/WGPs ao vivo pelo umr, com tabela salva para o boot; não use com o kernel que já libera os 40 CUs (bc250_cc_write_mode=3)" },
    { name = "bc250-core-unlock", bins = ["bc250-unlock-cores.py"], git = "https://github.com/rw-r-r-0644/bc250-core-unlock", scripts = ["bc250-unlock-cores.py"], url = "https://github.com/rw-r-r-0644/bc250-core-unlock", about = "liga os 2 núcleos extras pela SMU com o sistema rodando; some ao desligar da tomada (reinício não perde)" },
    { name = "bc250-core-cu-unlock", bins = ["bc250-8core-unlock.sh", "bc250-8core-unlock"], git = "https://github.com/GabriWar/bc250-core-cu-unlock", scripts = ["bc250-8core-unlock.sh", "bc250-40cu-unlock.sh", "test-cores.sh"], url = "https://github.com/GabriWar/bc250-core-cu-unlock", about = "scripts dos 8 núcleos e dos 40 CUs (status/apply/install), tabelas ACPI de 8 núcleos e teste por núcleo" },
    { name = "bc250_smu_oc", bins = ["bc250-detect", "bc250-apply"], git = "https://github.com/bc250-collective/bc250_smu_oc", setup = "command -v pipx >/dev/null || sudo pacman -S --needed --noconfirm python-pipx; command -v stress >/dev/null || sudo pacman -S --needed --noconfirm stress; pipx install --force .", url = "https://github.com/bc250-collective/bc250_smu_oc", about = "overclock e undervolt da CPU pela SMU (bc250-detect acha o estável, bc250-apply aplica e instala o serviço)" },
    { name = "BC250-Telemetry", bins = ["apu_telemetry"], git = "https://github.com/onlinermm/BC250-Telemetry", setup = "./install.sh", url = "https://github.com/onlinermm/BC250-Telemetry", about = "serviço e painel web de telemetria da APU (temperatura, potência, clocks, temperatura da memória), com integração ao MangoHud" },
    { name = "bc250-efi-core-unlock", bins = [], url = "https://github.com/Hexxeh/bc250-efi-core-unlock", about = "EFI que liga os 8 núcleos antes de cada boot (não some ao desligar). A instalação mexe na ordem de boot: siga o README dele (o numapilot não instala)" },
    { name = "bc250-memory-temperature", bins = [], url = "https://github.com/pan-Rijovich/bc250-memory-temperature", about = "lê a temperatura da memória GDDR6 pela SMU (o BC250-Telemetry já inclui)" },
]
notes = [
    "O clock da GPU precisa de um governor da comunidade (o -smu dispensa kernel com patch); sem ele a GPU fica parada em ~1000-1500 MHz e gasta ~20 W a mais parada.",
    "O IOMMU causa travamentos na BC-250: use amd_iommu=off (aba Máquina, Parâmetros do kernel).",
    "Overclock da CPU pela SMU (bc250_smu_oc): mesmo na frequência de fábrica ele aplica um undervolt grande.",
    "Com o kernel atual do CachyOS não precisa mais de kernel com patch: os 40 CUs e os 8 núcleos se desbloqueiam pelos programas abaixo.",
    "Depois de desbloquear núcleos ou CUs, o overclock/undervolt que era estável pode deixar de ser: refaça os testes (CPU e GPU dividem a mesma energia e o mesmo calor).",
    "8 núcleos pelo bc250-core-unlock se perdem ao desligar da tomada (só sobrevivem a reinício); pelo biosmod ou pelo bc250-efi-core-unlock ficam. A VRAM (UMA) se muda na BIOS.",
    "Com o kernel linux-cachyos-bc250 e amdgpu.bc250_cc_write_mode=3, os 40 CUs já vêm liberados do boot: não use o desbloqueio ao vivo (umr) junto.",
    "Clock da GPU: confie no hwmon (freq1_input). Com 8 núcleos sem a tabela certa da SMU, pp_dpm_sclk, temperatura e potência vêm erradas; o pp_dpm_fclk da Cyan Skillfish repete o clock da memória, não é um FCLK separado.",
    "Se a GPU travar com o governor rodando, pare o governor antes de jogos problemáticos.",
]

[[board]]
id = "bc160"
name = "AMD BC-160 (Navi 12)"
gpu_ids = ["1002:7360"]
gfx = ["gfx1011"]
name_contains = ["navi 12"]
headless = true
notes = [
    "Placa sem saída de vídeo: renderiza nela e mostra a imagem pela outra placa (como as MI50).",
    "Clock e voltagem pela curva de 3 pontos (como Vega20/RDNA1), ventoinha blower pelo hwmon.",
    "Sem ROCm oficial (gfx1011): para IA, use o llama.cpp com Vulkan.",
]

[[board]]
id = "mi50"
name = "AMD Instinct MI50 / Radeon VII (gfx906)"
gfx = ["gfx906"]
notes = [
    "ROCm pela comunidade (mixa3607/ML-gfx906), com validação antes de cada atualização (gfx906-rocm).",
]

[[cpu]]
match = "i7-5775C"
notes = [
    "Broadwell com 128 MB de eDRAM (funciona como cache L4) e Iris Pro 6200.",
    "Undervolt pela ferramenta intel-undervolt (AUR), se a BIOS não bloquear.",
]

[[cpu]]
match = "CC150"
notes = [
    "Comet Lake de 8 núcleos/16 threads com multiplicador travado: o que dá para ajustar são os limites de potência (PL1/PL2) na aba Máquina.",
]

[[cpu]]
match = "E5-2696 v4"
notes = [
    "Broadwell-EP: uncore no máximo e jogos num socket só fazem a maior diferença; mitigações custam caro nesta geração.",
]

# Arquiteturas de GPU: computação e upscaling que funcionam em cada uma.
[[arch]]
prefix = "gfx906"
family = "Vega 20 (GCN 5)"
compute = "rocm-comunidade"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx101"
family = "RDNA 1"
compute = "vulkan"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx1013"
family = "RDNA 2 (BC-250 / Cyan Skillfish)"
compute = "vulkan"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx103"
family = "RDNA 2"
compute = "rocm"
upscale = ["fsr4-int8-experimental", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx110"
family = "RDNA 3"
compute = "rocm"
upscale = ["fsr4-rdna3", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx115"
family = "RDNA 3.5 (APU)"
compute = "rocm"
upscale = ["fsr4-int8-experimental", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx120"
family = "RDNA 4"
compute = "rocm"
upscale = ["fsr4", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "nvidia"
family = "NVIDIA"
compute = "cuda"
upscale = ["dlss", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "intel"
family = "Intel"
compute = "vulkan"
upscale = ["xess", "fsr3", "fsr1-gamescope", "lsfg"]
