# Community recipes: what numapilot knows about each board and GPU.
# Updatable without rebuilding: `numapilot recipes update` writes a new copy to
# /var/lib/numapilot/recipes.toml, which takes priority over this one.
# The texts are in English; their Portuguese versions live in src/i18n_pt.rs.
version = 2

[[board]]
id = "bc250"
name = "AMD BC-250 (Cyan Skillfish)"
gpu_ids = ["1002:13fe"]
gfx = ["gfx1013"]
name_contains = ["cyan skillfish"]
# Kernels that break the BC-250's GPU driver (closed ranges).
bad_kernels = [["6.15.0", "6.15.6"], ["6.17.8", "6.17.10"]]
min_mesa = "25.1"
governor_services = ["cyan-skillfish-governor-smu", "cyan-skillfish-governor-tt", "cyan-skillfish-governor", "oberon-governor"]
governor_configs = [
    "/etc/cyan-skillfish-governor-smu/config.toml",
    "/etc/cyan-skillfish-governor-tt/config.toml",
    "/etc/cyan-skillfish-governor/config.toml",
]
governor_aur = ["cyan-skillfish-governor-smu", "cyan-skillfish-governor"]
kernel_params = ["amd_iommu=off"]
cpu_oc_tools = ["bc250-detect", "bc250-apply"]
cpu_oc_url = "https://github.com/bc250-collective/bc250_smu_oc"
docs = "https://elektricm.github.io/amd-bc250-docs/"
no_video_encoder = true
cores = [6, 8]
cus = [24, 40]
apps = [
    { name = "BC250 Control Center", recommended = true, bins = ["bc250-control-center"], aur = "bc250-control-center-git", url = "https://github.com/movacx/bc250-control-center", about = "does everything on the BC-250: GPU governor and voltage lab, CPU overclock, fan, 40 CUs live, 8 cores, GPU memory (TTM), telemetry. The author's own -git package: updating rebuilds from the newest code" },
    { name = "umr", bins = ["umr"], aur = "umr-git", url = "https://gitlab.freedesktop.org/tomstdenis/umr", about = "access to the GPU registers, used to enable the 40 CUs without a patched kernel" },
    { name = "bc250-cu-live-manager", bins = ["bc250-cu-live-manager.sh"], git = "https://github.com/WinnieLV/bc250-cu-live-manager", scripts = ["bc250-cu-live-manager.sh"], aur_deps = ["umr-git"], url = "https://github.com/WinnieLV/bc250-cu-live-manager", about = "turns CUs/WGPs on and off live through umr, with a table saved for boot; do not use it with the kernel that already unlocks the 40 CUs (bc250_cc_write_mode=3)" },
    { name = "bc250-core-unlock", bins = ["bc250-unlock-cores.py"], git = "https://github.com/rw-r-r-0644/bc250-core-unlock", scripts = ["bc250-unlock-cores.py"], url = "https://github.com/rw-r-r-0644/bc250-core-unlock", about = "enables the 2 extra cores through the SMU with the system running; lost when unplugged from the wall (a reboot keeps them)" },
    { name = "bc250-core-cu-unlock", bins = ["bc250-8core-unlock.sh", "bc250-8core-unlock"], git = "https://github.com/GabriWar/bc250-core-cu-unlock", scripts = ["bc250-8core-unlock.sh", "bc250-40cu-unlock.sh", "test-cores.sh"], url = "https://github.com/GabriWar/bc250-core-cu-unlock", about = "scripts for the 8 cores and the 40 CUs (status/apply/install), 8-core ACPI tables and a per-core test" },
    { name = "bc250_smu_oc", bins = ["bc250-detect", "bc250-apply"], git = "https://github.com/bc250-collective/bc250_smu_oc", setup = "command -v pipx >/dev/null || sudo pacman -S --needed --noconfirm python-pipx; command -v stress >/dev/null || sudo pacman -S --needed --noconfirm stress; pipx install --force .", url = "https://github.com/bc250-collective/bc250_smu_oc", about = "CPU overclock and undervolt through the SMU (bc250-detect finds the stable point, bc250-apply applies it and installs the service)" },
    { name = "BC250-Telemetry", bins = ["apu_telemetry"], git = "https://github.com/onlinermm/BC250-Telemetry", setup = "./install.sh", url = "https://github.com/onlinermm/BC250-Telemetry", about = "APU telemetry service and web panel (temperature, power, clocks, memory temperature), with MangoHud integration" },
    { name = "bc250-efi-core-unlock", bins = [], url = "https://github.com/Hexxeh/bc250-efi-core-unlock", about = "EFI that enables the 8 cores before every boot (not lost when unplugged). Installing it changes the boot order: follow its README (numapilot does not install it)" },
    { name = "bc250-memory-temperature", bins = [], url = "https://github.com/pan-Rijovich/bc250-memory-temperature", about = "reads the GDDR6 memory temperature through the SMU (BC250-Telemetry already includes it)" },
]
notes = [
    "The GPU clock needs a community governor (the -smu one needs no patched kernel); without it the GPU stays stuck at ~1000-1500 MHz and draws ~20 W more when idle.",
    "The IOMMU causes freezes on the BC-250: use amd_iommu=off (Machine tab, Kernel parameters).",
    "CPU overclock through the SMU (bc250_smu_oc): even at the factory frequency it applies a large undervolt.",
    "With the current CachyOS kernel a patched kernel is no longer needed: the 40 CUs and the 8 cores are unlocked by the programs below.",
    "After unlocking cores or CUs, an overclock/undervolt that was stable may stop being so: redo the tests (CPU and GPU share the same power and the same heat).",
    "8 cores through bc250-core-unlock are lost when unplugged from the wall (they only survive a reboot); through the biosmod or bc250-efi-core-unlock they stay. The VRAM (UMA) is changed in the BIOS.",
    "With the linux-cachyos-bc250 kernel and amdgpu.bc250_cc_write_mode=3, the 40 CUs are already unlocked from boot: do not use the live unlock (umr) together with it.",
    "GPU clock: trust hwmon (freq1_input). With 8 cores and the wrong SMU table, pp_dpm_sclk, temperature and power come out wrong; Cyan Skillfish's pp_dpm_fclk repeats the memory clock, it is not a separate FCLK.",
    "If the GPU hangs with the governor running, stop the governor before problematic games.",
]

[[board]]
id = "bc160"
name = "AMD BC-160 (Navi 12)"
gpu_ids = ["1002:7360"]
gfx = ["gfx1011"]
name_contains = ["navi 12"]
headless = true
notes = [
    "Card without a video output: render on it and show the image through the other card (like the MI50s).",
    "Clock and voltage through the 3-point curve (like Vega20/RDNA1), blower fan through hwmon.",
    "No official ROCm (gfx1011): for AI, use llama.cpp with Vulkan.",
]

[[board]]
id = "mi50"
name = "AMD Instinct MI50 / Radeon VII (gfx906)"
gfx = ["gfx906"]
notes = [
    "ROCm from the community (mixa3607/ML-gfx906), with validation before each update (gfx906-rocm).",
]

[[cpu]]
match = "i7-5775C"
notes = [
    "Broadwell with 128 MB of eDRAM (works as an L4 cache) and Iris Pro 6200.",
    "Undervolt through the intel-undervolt tool (AUR), if the BIOS does not block it.",
]

[[cpu]]
match = "CC150"
notes = [
    "8-core/16-thread Comet Lake with a locked multiplier: what can be tuned are the power limits (PL1/PL2) in the Machine tab.",
]

[[cpu]]
match = "E5-2696 v4"
notes = [
    "Broadwell-EP: uncore at maximum and games on a single socket make the biggest difference; mitigations are expensive on this generation.",
]

# GPU architectures: compute and upscaling that work on each one.
[[arch]]
prefix = "gfx906"
family = "Vega 20 (GCN 5)"
compute = "rocm-community"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx101"
family = "RDNA 1"
compute = "vulkan"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx1013"
family = "RDNA 2 (BC-250 / Cyan Skillfish)"
compute = "vulkan"
upscale = ["fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx103"
family = "RDNA 2"
compute = "rocm"
upscale = ["fsr4-int8-experimental", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx110"
family = "RDNA 3"
compute = "rocm"
upscale = ["fsr4-rdna3", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx115"
family = "RDNA 3.5 (APU)"
compute = "rocm"
upscale = ["fsr4-int8-experimental", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "gfx120"
family = "RDNA 4"
compute = "rocm"
upscale = ["fsr4", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "nvidia"
family = "NVIDIA"
compute = "cuda"
upscale = ["dlss", "fsr3", "xess", "fsr1-gamescope", "lsfg"]

[[arch]]
prefix = "intel"
family = "Intel"
compute = "vulkan"
upscale = ["xess", "fsr3", "fsr1-gamescope", "lsfg"]
