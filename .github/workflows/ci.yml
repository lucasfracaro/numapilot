name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl-dev libdbus-1-dev shellcheck
      - name: Formatação
        run: cargo fmt --check
      - name: Testes
        run: cargo test --release
      - name: Clippy
        # Erros de verdade (correctness/suspicious) quebram o CI; lints de estilo novos só avisam.
        run: cargo clippy --release --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Só a linha de comando (sem interface)
        run: cargo build --release --no-default-features
      - name: Shellcheck
        run: shellcheck -S warning install.sh uninstall.sh packaging/gfx906-rocm container/lab-start packaging/arch/numapilot.install
