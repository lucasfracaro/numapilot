# /etc/gfx906-rocm.conf — usado pelo script gfx906-rocm

# Onde as versões ficam (uma pasta por versão + links "current" e "previous").
ROCM_BASE=/opt/rocm-gfx906

# Índice onde o `gfx906-rocm update` procura tarballs novos, e o filtro do nome.
# Padrão: tarballs noturnos do TheRock (AMD), que a comunidade usa na gfx906.
# Se o formato do índice mudar, use `gfx906-rocm install <url>` com o link direto.
INDEX_URL="https://rocm.nightlies.amd.com/tarball/"
FILTER="gfx906"

# Quantas versões manter no `prune` (a ativa e a anterior nunca são apagadas).
KEEP=3

# Imagem para `gfx906-rocm container` (build comunitário mixa3607 / ML-gfx906).
IMAGE="docker.io/mixa3607/rocm-gfx906:7.14-complete"
# ENGINE=podman   # ou docker; vazio = detecta
